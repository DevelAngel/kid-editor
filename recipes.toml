# Recipes for the `recipe_run` MCP tool (enable with `--recipes-file
# recipes.toml`) and the standalone `recipe` CLI. See ADR 0004.
#
# Deliberately minimal: no shell, no variadic passthrough of extra flags
# (the `justfile` this is ported from uses `*args`/`+args` for that on
# several git recipes) — every parameter here is a single named slot
# substituted into exactly one `run` element. Extend a recipe's `run`
# array directly if a specific extra flag turns out to be needed
# regularly, rather than reopening free-form argument passthrough.

[recipe.check]
description = "Check that the whole project still compiles, including tests"
run = ["cargo", "check", "--all-targets"]

[recipe.check.annotations]
read_only = false
destructive = false
idempotent = true
open_world = false

[recipe.lint]
description = "Run the linter (Clippy) and report style/correctness issues"
run = ["cargo", "clippy"]

[recipe.lint.annotations]
read_only = false
destructive = false
idempotent = true
open_world = false

[recipe.test]
description = "Run the full test suite"
run = ["cargo", "test"]

[recipe.test.annotations]
read_only = false
destructive = false
idempotent = true
open_world = false

[recipe.test-one]
description = "Run a single test by name"
run = ["cargo", "test", "--", "{name}"]

[recipe.test-one.args.name]
help = "name of the test to run"

[recipe.test-one.annotations]
read_only = false
destructive = false
idempotent = true
open_world = false

[recipe.debug-native]
description = "Build the project with debug symbols"
run = ["cargo", "build"]

[recipe.debug-native.annotations]
read_only = false
destructive = false
idempotent = true
open_world = false

[recipe.release-native]
description = "Build an optimized release binary"
run = ["cargo", "build", "--release", "--locked"]

[recipe.release-native.annotations]
read_only = false
destructive = false
idempotent = true
open_world = false

[recipe.git-status]
description = "Show which files have uncommitted changes"
run = ["git", "status"]

[recipe.git-status.annotations]
read_only = true
destructive = false
idempotent = true
open_world = false

[recipe.git-diff]
description = "Show what changed, line by line, since the last commit"
run = ["git", "diff"]

[recipe.git-diff.annotations]
read_only = true
destructive = false
idempotent = true
open_world = false

[recipe.git-log]
description = "Show recent commit history"
run = ["git", "log", "--no-color", "--graph", "--pretty=format:%h • %s (%(decorate:prefix=,suffix= • )%cr)"]

[recipe.git-log.annotations]
read_only = true
destructive = false
idempotent = true
open_world = false

[recipe.git-branch]
description = "Create and switch to a new branch"
run = ["git", "switch", "-c", "{name}"]

[recipe.git-branch.args.name]
help = "name of the new branch"

[recipe.git-branch.annotations]
read_only = false
destructive = false
idempotent = false
open_world = false

[recipe.git-switch]
description = "Switch to an existing branch"
run = ["git", "switch", "{name}"]

[recipe.git-switch.args.name]
help = "name of the branch to switch to"

[recipe.git-switch.annotations]
read_only = false
destructive = false
idempotent = true
open_world = false

[recipe.git-pull]
description = "Fetch and integrate changes from the remote for the current branch"
run = ["git", "pull"]

[recipe.git-pull.annotations]
read_only = false
destructive = false
idempotent = true
open_world = true

[recipe.git-add]
description = "Stage a file's changes so the next commit includes them"
run = ["git", "add", "{path}"]

[recipe.git-add.args.path]
help = "file or directory to stage"

[recipe.git-add.annotations]
read_only = false
destructive = false
idempotent = true
open_world = false

[recipe.git-mv]
description = "Rename or move a tracked file, staging the change"
run = ["git", "mv", "{source}", "{destination}"]

[recipe.git-mv.args.source]
help = "current path of the tracked file"

[recipe.git-mv.args.destination]
help = "new path for the file"

[recipe.git-mv.annotations]
read_only = false
destructive = false
idempotent = false
open_world = false

[recipe.git-rm]
description = "Remove a tracked file, staging the deletion"
run = ["git", "rm", "{path}"]

[recipe.git-rm.args.path]
help = "file or directory to remove"

[recipe.git-rm.annotations]
read_only = false
destructive = true
idempotent = false
open_world = false

[recipe.git-restore]
description = "Unstage a file, keeping its working-tree changes"
run = ["git", "restore", "--staged", "{path}"]

[recipe.git-restore.args.path]
help = "file or directory to unstage"

[recipe.git-restore.annotations]
read_only = false
destructive = false
idempotent = true
open_world = false

[recipe.git-reset-soft]
description = "Undo the last commit, keeping its changes staged"
run = ["git", "reset", "--soft", "HEAD~1"]

[recipe.git-reset-soft.annotations]
read_only = false
destructive = true
idempotent = false
open_world = false

[recipe.git-commit]
description = "Save all staged changes as a new commit, authored by DevelAngel"
# TODO: adapt the hardcoded --author identity below when reusing this
# recipes.toml for a different project or committer.
run = ["git", "commit", "--author", "Angelos Drossos <develangel@mail.drossos.de>", "--message", "{message}"]

[recipe.git-commit.args.message]
help = "commit message"

[recipe.git-commit.annotations]
read_only = false
destructive = false
idempotent = false
open_world = false

[recipe.git-rebase]
description = "Replay this branch's commits on top of another branch"
run = ["git", "rebase", "{target}"]

[recipe.git-rebase.args.target]
help = "branch or commit to rebase onto"

[recipe.git-rebase.annotations]
read_only = false
destructive = true
idempotent = false
open_world = false

[recipe.git-rebase-continue]
description = "Continue a rebase after fixing a conflict"
run = ["git", "rebase", "--continue"]

[recipe.git-rebase-continue.annotations]
read_only = false
destructive = true
idempotent = false
open_world = false

[recipe.git-rebase-abort]
description = "Cancel an in-progress rebase and return to the previous state"
run = ["git", "rebase", "--abort"]

[recipe.git-rebase-abort.annotations]
read_only = false
destructive = true
idempotent = false
open_world = false

[recipe.git-push]
description = "Push the current branch to origin, setting upstream if needed"
run = ["git", "push", "--set-upstream", "origin", "HEAD"]

[recipe.git-push.annotations]
read_only = false
destructive = false
idempotent = true
open_world = true

[recipe.git-push-force]
description = "Force-push the current branch, overwriting remote history"
run = ["git", "push", "--force-with-lease", "origin", "HEAD"]

[recipe.git-push-force.annotations]
read_only = false
destructive = true
idempotent = true
open_world = true

[recipe.gh-pr-create]
description = "Open a pull request for the current branch. Write the body per .agents/skills/code-review-request-writing-guide/SKILL.md (TL;DR, Why/What/How, Breaking changes)."
run = ["gh", "pr", "create", "--title", "{title}", "--body", "{body}", "--base", "main"]

[recipe.gh-pr-create.args.title]
help = "PR title"

[recipe.gh-pr-create.args.body]
help = "PR description"

[recipe.gh-pr-create.annotations]
read_only = false
destructive = false
idempotent = false
open_world = true

[recipe.gh-pr-edit]
description = "Update an existing pull request's title and/or description. Follow .agents/skills/code-review-request-writing-guide/SKILL.md when rewriting the body."
run = ["gh", "pr", "edit", "{number}", "--title", "{title}", "--body", "{body}"]

[recipe.gh-pr-edit.args.number]
help = "PR number"

[recipe.gh-pr-edit.args.title]
help = "new PR title"

[recipe.gh-pr-edit.args.body]
help = "new PR description"

[recipe.gh-pr-edit.annotations]
read_only = false
destructive = false
idempotent = true
open_world = true

[recipe.gh-pr-view]
description = "Show PR metadata and issue-level comments"
run = ["gh", "pr", "view", "{number}", "--json", "title,body,comments,reviews"]

[recipe.gh-pr-view.args.number]
help = "PR number"

[recipe.gh-pr-view.annotations]
read_only = true
destructive = false
idempotent = true
open_world = true

[recipe.gh-pr-review-comments]
description = "List inline review comments on a PR"
# TODO: adapt the hardcoded repos/DevelAngel/kid-editor path below when
# reusing this recipes.toml for a different repository.
run = ["gh", "api", "repos/DevelAngel/kid-editor/pulls/{number}/comments", "--jq", "[.[] | {id, path, line, author: .user.login, body}]"]

[recipe.gh-pr-review-comments.args.number]
help = "PR number"

[recipe.gh-pr-review-comments.annotations]
read_only = true
destructive = false
idempotent = true
open_world = true

[recipe.gh-pr-comment]
description = "Post an issue-level reply on a PR"
run = ["gh", "pr", "comment", "{number}", "--body", "{body}"]

[recipe.gh-pr-comment.args.number]
help = "PR number"

[recipe.gh-pr-comment.args.body]
help = "reply text"

[recipe.gh-pr-comment.annotations]
read_only = false
destructive = false
idempotent = false
open_world = true

[recipe.gh-pr-approve]
description = "Approve a pull request"
run = ["gh", "pr", "review", "{number}", "--approve", "--body", "{body}"]

[recipe.gh-pr-approve.args.number]
help = "PR number"

[recipe.gh-pr-approve.args.body]
help = "approval comment"

[recipe.gh-pr-approve.annotations]
read_only = false
destructive = false
idempotent = false
open_world = true
