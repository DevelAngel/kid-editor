# Recipes for the `recipe_run` MCP tool (enable with `--recipes-file
# recipes.toml`) and the standalone `recipe` CLI. See ADR 0004.
#
# Deliberately minimal: no shell, no variadic passthrough of extra flags
# (the `justfile` this is ported from uses `*args`/`+args` for that on
# several git recipes) — every parameter here is a single named slot
# substituted into exactly one `run` element. Extend a recipe's `run`
# array directly if a specific extra flag turns out to be needed
# regularly, rather than reopening free-form argument passthrough.

# --- Rust ---

[recipe.rust-check]
description = "Check that the whole project still compiles, including tests"
run = ["cargo", "check", "--all-targets"]

[recipe.rust-check.annotations]
title = "Rust Check"
read_only = true
destructive = false
idempotent = true
open_world = false

[recipe.rust-lint]
description = "Run the linter (Clippy) and report style/correctness issues"
run = ["cargo", "clippy"]

[recipe.rust-lint.annotations]
title = "Rust Lint"
read_only = true
destructive = false
idempotent = true
open_world = false

[recipe.rust-test]
description = "Run the full test suite"
run = ["cargo", "test"]

[recipe.rust-test.annotations]
title = "Rust Test"
read_only = true
destructive = false
idempotent = true
open_world = false

[recipe.rust-test-one]
description = "Run a single test by name"
run = ["cargo", "test", "--", "{name}"]

[recipe.rust-test-one.args.name]
help = "name of the test to run"
level = "info"

[recipe.rust-test-one.annotations]
title = "Rust Test One"
read_only = true
destructive = false
idempotent = true
open_world = false

[recipe.rust-build-debug]
description = "Build the project with debug symbols"
run = ["cargo", "build"]

[recipe.rust-build-debug.annotations]
title = "Rust Build (Debug)"
read_only = true
destructive = false
idempotent = true
open_world = false

[recipe.rust-build-release]
description = "Build an optimized release binary"
run = ["cargo", "build", "--release", "--locked"]

[recipe.rust-build-release.annotations]
title = "Rust Build (Release)"
read_only = true
destructive = false
idempotent = true
open_world = false

# --- GitHub ---

[recipe.gh-pr-create]
description = "Open a pull request for the current branch. Write the body per the code-review-request-writing-guide skill (TL;DR, Why/What/How, Breaking changes)."
run = ["gh", "pr", "create", "--title", "{title}", "--body", "{body}", "--base", "main"]

[recipe.gh-pr-create.args.title]
help = "PR title"
level = "info"

[recipe.gh-pr-create.args.body]
help = "PR description"
level = "debug"
type = "text"

[recipe.gh-pr-create.annotations]
title = "Create Pull Request"
read_only = false
destructive = false
idempotent = false
open_world = true

[recipe.gh-pr-edit]
description = "Update an existing pull request's title and/or description. Follow the code-review-request-writing-guide skill when rewriting the body."
run = ["gh", "pr", "edit", "{number}", "--title", "{title}", "--body", "{body}"]

[recipe.gh-pr-edit.args.number]
help = "PR number"
level = "info"

[recipe.gh-pr-edit.args.title]
help = "new PR title"
level = "info"

[recipe.gh-pr-edit.args.body]
help = "new PR description"
level = "debug"
type = "text"

[recipe.gh-pr-edit.annotations]
title = "Edit Pull Request"
read_only = false
destructive = false
idempotent = true
open_world = true

[recipe.gh-pr-view]
description = "Show PR metadata and issue-level comments"
run = ["gh", "pr", "view", "{number}", "--json", "title,body,comments,reviews"]

[recipe.gh-pr-view.args.number]
help = "PR number"
level = "info"

[recipe.gh-pr-view.annotations]
title = "View Pull Request"
read_only = true
destructive = false
idempotent = true
open_world = true

[recipe.gh-pr-review-comments]
description = "List unresolved, non-outdated inline review comments on a PR"
run = ["gh", "monitor", "review", "view", "{number}", "--unresolved", "--not_outdated"]

[recipe.gh-pr-review-comments.args.number]
help = "PR number"
level = "info"

[recipe.gh-pr-review-comments.annotations]
title = "List Review Comments"
read_only = true
destructive = false
idempotent = true
open_world = true

[recipe.gh-pr-comment]
description = "Post an issue-level reply on a PR"
run = ["gh", "pr", "comment", "{number}", "--body", "{body}"]

[recipe.gh-pr-comment.args.number]
help = "PR number"
level = "info"

[recipe.gh-pr-comment.args.body]
help = "reply text"
level = "debug"
type = "text"

[recipe.gh-pr-comment.annotations]
title = "Comment on Pull Request"
read_only = false
destructive = false
idempotent = false
open_world = true

[recipe.gh-pr-approve]
description = "Approve a pull request"
run = ["gh", "pr", "review", "{number}", "--approve", "--body", "{body}"]

[recipe.gh-pr-approve.args.number]
help = "PR number"
level = "info"

[recipe.gh-pr-approve.args.body]
help = "approval comment"
level = "debug"
type = "text"

[recipe.gh-pr-approve.annotations]
title = "Approve Pull Request"
read_only = false
destructive = false
idempotent = false
open_world = true
