[package]
name = "kid-text-editor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license-file.workspace = true
readme.workspace = true
keywords = ["editor", "text-editor", "mcp"]

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
axum.workspace = true
clap.workspace = true
clap-verbosity-flag.workspace = true
glob.workspace = true
grep-regex = "0.1.13"
grep-searcher = "0.1.14"
indexmap.workspace = true
innr = "0.1.4"
nucleo-matcher = "0.3.1"
regex = "1.11.4"
rmcp = { workspace = true, features = [
  "auth",
  "server",
  "schemars",
  "transport-streamable-http-server",
] }
secrecy = { workspace = true, features = ["serde"] }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tower-http = { workspace = true, features = ["cors", "trace"] }
tokio-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
url = { workspace = true, features = ["serde"] }
type-state-builder.workspace = true
askama = "0.16.0"
base64 = "0.23.0"
chrono = "0.4.45"
sha2 = { version = "0.11.0", features = ["zeroize"] }
uuid = { version = "1.24.0", features = ["atomic", "serde", "v4", "v7", "zerocopy"] }
derive_more = { version = "2.1.1", features = ["deref", "display", "from", "from_str"] }
serde_urlencoded = "0.7.1"
toml.workspace = true
recipe = { path = "../recipe" }

[dev-dependencies]
assert_fs.workspace = true
indoc.workspace = true
