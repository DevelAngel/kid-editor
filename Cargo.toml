[workspace]
resolver = "3"
members = ["text"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
authors = ["Angelos Drossos"]
license-file = "LICENSE"
readme = "README.md"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.dependencies]
anyhow = "1.0.104"
assert_fs = "1.1.3"
async-openai = "0.41"
axum = "0.8.9"
clap = { version = "4.6.4", features = ["derive", "env"] }
clap-verbosity-flag = { version = "3.0.4", features = ["tracing"] }
matrix-sdk = { version = "0.18.0", features = ["anyhow", "bundled-sqlite", "markdown"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
rmcp = "3.1.0"
secrecy = "0.10.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.145"
tokio = { version = "1.52.3", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
tower-http = "0.7.0"
tokio-util = "0.7.18"
