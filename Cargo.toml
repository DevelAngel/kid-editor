[workspace]
resolver = "3"
members = ["text", "recipe", "oauth", "gateway", "logging"]

[workspace.package]
version = "0.8.0"
edition = "2024"
rust-version = "1.97.1"
authors = ["Angelos Drossos"]
license-file = "LICENSE"
readme = "README.md"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.dependencies]
anyhow = "1.0.104"
askama = "0.16.0"
assert_fs = "1.1.3"
axum = "0.8.9"
base64 = "0.23.0"
chrono = "0.4.45"
clap = { version = "4.6.4", features = ["derive", "env"] }
clap-verbosity-flag = { version = "3.0.4", features = ["tracing"] }
derive_more = "2.1.1"
glob = "0.3.3"
indexmap = "2.14.0"
indoc = "2.0.7"
rmcp = "3.1.0"
reqwest = "0.13.2"
secrecy = "0.10.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.145"
serde_urlencoded = "0.7.1"
sha2 = "0.11.0"
tokio = { version = "1.52.3", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tower-http = "0.7.0"
tokio-util = "0.7.18"
toml = "1.1.4"
type-state-builder = "0.5.1"
url = "2.5.8"
uuid = "1.24.0"
