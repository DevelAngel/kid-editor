[package]
name = "kid-oauth"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license-file.workspace = true
readme.workspace = true

[lints]
workspace = true

[features]
default = []
server = ["dep:axum", "dep:askama", "dep:base64", "dep:chrono", "dep:sha2", "dep:uuid", "dep:derive_more", "dep:serde_urlencoded", "rmcp/server"]
client = ["dep:reqwest", "rmcp/client"]

[dependencies]
anyhow.workspace = true
rmcp = { workspace = true, features = ["auth"] }
secrecy = { workspace = true, features = ["serde"] }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
url = { workspace = true, features = ["serde"] }
toml.workspace = true
axum = { workspace = true, optional = true }
askama = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
chrono = { workspace = true, optional = true }
sha2 = { workspace = true, features = ["zeroize"], optional = true }
uuid = { workspace = true, features = ["atomic", "serde", "v4", "v7", "zerocopy"], optional = true }
derive_more = { workspace = true, features = ["deref", "display", "from", "from_str"], optional = true }
serde_urlencoded = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
